name: Quest 64 (North America)
sha1: 91b96e938c6d91699057fad91d726ee5a23ce33a
options:
  basename: quest64
  target_path: baserom.us.z64
  elf_path: build/quest64.elf
  base_path: .
  platform: n64
  compiler: IDO

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True
  ld_symbol_header_path: include/ld_addrs.h
  ld_script_path: quest64.ld
  ld_dependencies: True
  ld_generate_symbol_per_data_segment: False
  
  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  #mips_abi_float_regs: o32

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions : True

  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_all_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  # libultra_symbols: True
  # hardware_regs: True
  gfx_ucode: f3dex # one of [f3d, f3db, f3dex, f3dexb, f3dex2]
segments:
  - name: header
    type: databin
    start: 0x0

  - name: boot
    type: databin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    bss_size: 0x239C0
    symbol_name_format: $VRAM
